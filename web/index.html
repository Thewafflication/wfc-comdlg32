<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wfc-comdlg32 in WebAssembly</title>
<style>
  :root {
    --bg: #11141f; --panel: #1b2033; --edge: #3a4560; --text: #e8ebf5;
    --muted: #98a0b8; --teal: #3dd6c6; --amber: #ffb454; --chip: #252c45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 28px; color: var(--muted); }
  .tag {
    display: inline-block; margin-right: 8px; padding: 1px 10px;
    border: 1px solid var(--edge); border-radius: 999px; font-size: 13px;
    color: var(--teal);
  }
  .cards { display: grid; gap: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 6px; padding: 20px 24px 22px;
    box-shadow: 3px 4px 0 #0f0a08, 7px 9px 0 #17100d;
  }
  .card h2 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .counts { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; }
  .names span {
    padding: 2px 10px; border-radius: 4px; background: var(--chip);
    font: 13px Consolas, ui-monospace, monospace; color: var(--text);
  }
  .names span.method { color: var(--amber); }
  .events { margin-top: 14px; color: var(--muted); font-size: 13px; }
  footer { margin-top: 36px; color: var(--muted); font-size: 13px; }
  footer b { color: var(--amber); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">wfc-comdlg32</h1>
  <p class="sub" id="sub">Loading the WebAssembly module...</p>
  <div class="cards" id="cards"></div>
  <footer>The class and member names come from the library's member table,
  compiled to WebAssembly with Emscripten.
  <b>Amber</b> names are methods.</footer>
</main>
<script src="comdlg32.js"></script>
<script>
  create_comdlg32().then((m) => {
    const text = (name, ...args) =>
      m.UTF8ToString(m.ccall(name, 'number', args.map(() => 'number'), args));
    const num = (name, ...args) =>
      m.ccall(name, 'number', args.map(() => 'number'), args);
    document.getElementById('title').textContent =
      text('library_name') + ' in WebAssembly';
    const sub = document.getElementById('sub');
    sub.textContent = '';
    for (const label of ['version ' + text('library_version'),
                         'targets ' + text('library_target')]) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = label;
      sub.appendChild(tag);
    }
    const cards = document.getElementById('cards');
    for (let c = 0; c < num('class_count'); c++) {
      const members = num('member_count', c), events = num('event_count', c);
      // A property is listed twice (get and let): show each name once.
      const names = [];
      for (let i = 0; i < members; i++) {
        const name = text('member_name', c, i);
        if (!names.includes(name)) names.push(name);
      }
      const handlers = [];
      for (let i = 0; i < events; i++) handlers.push(text('event_name', c, i));
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h2></h2><div class="counts"></div>' +
        '<div class="names"></div><div class="events"></div>';
      card.querySelector('h2').textContent = text('class_name', c);
      card.querySelector('.counts').textContent =
        names.length + ' names in ' + members + ' table rows, ' + events +
        ' events';
      for (const name of names) {
        const chip = document.createElement('span');
        chip.textContent = name;
        // The methods of the control: ShowOpen and the others, and AboutBox.
        if (/^(Show|AboutBox)/.test(name)) chip.className = 'method';
        card.querySelector('.names').appendChild(chip);
      }
      card.querySelector('.events').textContent =
        events ? 'events: ' + handlers.join(', ') : 'no events';
      cards.appendChild(card);
    }
    const ready = document.createElement('span');
    ready.id = 'ready';
    ready.hidden = true;
    document.body.appendChild(ready);
  });
</script>
</body>
</html>
