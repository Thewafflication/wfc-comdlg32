# @file .pre-commit-config.yaml
# @brief wfc-comdlg32 commit gate: lint, build, then tests (WSP-CHECK-0001).
# @note Setup: python -m pip install --requirement requirements-dev.txt, then
#   pre-commit install. Modeled on the WFC gate, with its progress window and
#   its machine-wide single-gate lock (wfc-commit-gate.lock).
minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: wfc-gate-start
        name: WFC gate start (single instance, progress window)
        entry: pwsh -NoProfile -File scripts/Start-CommitGate.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: comdlg32-lint
        name: wfc-comdlg32 lint
        entry: pwsh -NoProfile -File scripts/Invoke-Lint.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: comdlg32-build
        name: wfc-comdlg32 build (x64 Debug)
        entry: pwsh -NoProfile -File scripts/Invoke-Build.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: comdlg32-tests
        name: wfc-comdlg32 tests (x64 Debug)
        entry: pwsh -NoProfile -File scripts/Invoke-Tests.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
